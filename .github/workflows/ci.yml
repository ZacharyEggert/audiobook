name: CI

# PRs only: macOS minutes bill at 10x on a private repo, and master only changes through a green PR.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode version lives in .xcode-version; simulator pinned here.
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"

jobs:
  # Linux, so it costs 1x. Pinned to the local brew versions; bump together.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.63.1 --lint .
      - run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 --strict

  # Packages and app in one macOS job, to pay for one runner start and checkout.
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: swift test
        run: |
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            swift test --package-path "$pkg" --enable-code-coverage
            echo "::endgroup::"
          done
      - run: brew install xcodegen && xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild test \
            -scheme EarReader \
            -destination "$SIMULATOR" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
