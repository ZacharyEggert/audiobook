name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode version lives in .xcode-version; simulator pinned here.
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install swiftlint swiftformat
      - run: swiftformat --lint .
      - run: swiftlint --strict

  # One job (not a matrix) so the required check name stays "package-tests".
  package-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: swift test
        run: |
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            swift test --package-path "$pkg" --enable-code-coverage
            echo "::endgroup::"
          done

  app-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - run: brew install xcodegen && xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild test \
            -scheme EarReader \
            -destination "$SIMULATOR" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
